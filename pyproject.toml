[project]
name = "pal-devices-data"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "jinja2==3.1.6",
  "pyyaml==6.0.3",
  "jsonschema==4.26.0",
  "markdown-it-py==4.2.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["."]
