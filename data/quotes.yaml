  lint_allow: [act-number]
- id: 398n-fn2
  text_verbatim: "Пункт 26 Положения об организации оказания паллиативной медицинской помощи, включая порядок взаимодействия медицинских организаций, организаций социального обслуживания и общественных объединений, иных некоммерческих организаций, осуществляющих свою деятельность в сфере охраны здоровья, утверждённого приказом Министерства здравоохранения Российской Федерации и Министерства труда и социальной защиты Российской Федерации от 31 мая 2019 г. № 345н/№ 372н (зарегистрирован Министерством юстиции Российской Федерации 26 июня 2019 г., регистрационный № 55053)."
  source_ref: pravo-398n
