  lint_allow: [act-number]
- id: 398n-fn1
  text_verbatim: "Часть 2 статьи 38 Федерального закона от 21 ноября 2011 г. № 323-ФЗ «Об основах охраны здоровья граждан в Российской Федерации»."
  source_ref: pravo-398n
  eoNumber: "0001202508130021"
