- id: 398n-p1
  text_verbatim: "1. Утвердить прилагаемый перечень медицинских изделий, предназначенных для поддержания функций органов и систем организма человека, предоставляемых пациенту при оказании паллиативной медицинской помощи для использования на дому."
  source_ref: pravo-398n
  eoNumber: "0001202508130021"
