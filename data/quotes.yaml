  lint_allow: [act-number]
- id: 208n-p25
  text_verbatim: "25. При оказании паллиативной медицинской помощи в амбулаторных условиях пациенту предоставляются для использования на дому медицинские изделия, предназначенные для поддержания функций органов и систем организма человека, включенные в перечень медицинских изделий, предназначенных для поддержания функций органов и систем организма человека, предоставляемых для использования на дому, утвержденный приказом Министерства здравоохранения Российской Федерации от 31 мая 2019 г. № 348н."
  source_ref: pravo-208n-243n
  eoNumber: "0001202505290031"
  url: "http://publication.pravo.gov.ru/document/0001202505290031"
  point: "пункт 25 Положения"
  scan_page: "8"
  verified: "true"
  verified_at: "2026-10-11"
  lint_allow: [act-number]
- id: 208n-p26
  text_verbatim: "26. В случае признания пациента, нуждающегося в оказании паллиативной медицинской помощи, инвалидом, предоставление отдельных видов указанных в пункте 25 Положения медицинских изделий, включенных в федеральный перечень реабилитационных мероприятий, технических средств реабилитации и услуг, предоставляемых инвалиду, утвержденный распоряжением Правительства Российской Федерации от 30 декабря 2005 г. № 2347-р, осуществляется в соответствии Правилами обеспечения инвалидов техническими средствами реабилитации и отдельных категорий граждан из числа ветеранов протезами (кроме зубных протезов), протезно-ортопедическими изделиями, утвержденными постановлением Правительства Российской Федерации от 7 апреля 2008 г. № 240 «О порядке обеспечения инвалидов техническими средствами реабилитации и отдельных категорий граждан из числа ветеранов протезами (кроме зубных протезов), протезно-ортопедическими изделиями»."
  source_ref: pravo-208n-243n
  eoNumber: "0001202505290031"
  url: "http://publication.pravo.gov.ru/document/0001202505290031"
  point: "пункт 26 Положения"
  scan_page: "9"
  verified: "true"
  verified_at: "2026-10-11"
  lint_allow: [act-number]
- id: 1195n-change
  text_verbatim: "Подгруппу медицинских изделий «Растворы/газы для санитарной обработки/обслуживания медицинских изделий и сопутствующие изделия» группы медицинских изделий «2. Вспомогательные и общебольничные медицинские изделия» перечня медицинских изделий, предназначенных для поддержания функций органов и систем организма человека, предоставляемых для использования на дому, утвержденного приказом Министерства здравоохранения Российской Федерации от 31 мая 2019 г. № 348н (зарегистрирован Министерством юстиции Российской Федерации 28 июня 2019 г., регистрационный № 55087), дополнить: 1) в графе «Вид медицинского изделия» позицией следующего содержания: «Раствор антибактериальный с антибиотиками для создания замка для катетера»; 2) в графе «Код вида медицинского изделия» позицией следующего содержания: «134620»."
  source_ref: pravo-1195n
  eoNumber: "0001202012040022"
