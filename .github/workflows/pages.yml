name: pages
on:
  push: { branches: [main] }
  schedule: [{ cron: "29 6 * * *" }]
  workflow_dispatch:
permissions: {}
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.11.7", enable-cache: false }
      - run: uv sync --frozen
      - run: uv run python -m opsite build
      - run: uv run python -m opsite check --ci
      - name: base
        run: |
          base="/${GITHUB_REPOSITORY#*/}/"
          grep -q "^base: ${base}\$" site.yaml
          grep -q "rel=\"canonical\" href=\"https://[^\"]*${base}\"" _site/index.html
          test -f _site/404.html
          test -f _site/sitemap.xml
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
