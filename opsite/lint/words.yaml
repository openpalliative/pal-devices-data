words:
  - pattern: умирающ
    instead: пишем «тяжелобольной человек», «ваш близкий»
  - pattern: обречённ
    instead: пишем «тяжелобольной человек»
  - pattern: (?<![А-Яа-яЁё])лежач
    instead: пишем «человек, за которым вы ухаживаете»
  - pattern: паллиативник
    instead: пишем «человек, которому нужна паллиативная помощь»
  - pattern: страда\w* раком
    instead: пишем «у него онкологическое заболевание»
  - pattern: борет\w* с болезнью|(?<![А-Яа-яЁё])борьб
    instead: пишем «лечится» или «следующий шаг»
  - pattern: отмучил|скончал|летальн
    instead: пишем «умер»
  - pattern: сдать в хоспис
    instead: пишем «лечь в хоспис»
  - pattern: (?<![А-Яа-яЁё])паллиатив(?![а-яё])
    instead: пишем «паллиативная помощь»
  - pattern: наркотик
    instead: пишем «обезболивающие»
  - pattern: держитесь|всё будет хорошо
    instead: признать ситуацию и дать шаг
  - pattern: (?<![А-Яа-яЁё])гражданин|(?<![А-Яа-яЁё])данн(ый|ая|ое|ого|ой|ом)(?![А-Яа-яЁё])|в целях
    instead: пишем «вы», «этот», «чтобы»
  - pattern: чиновник|беспредел|(?<![А-Яа-яЁё])власт(ь|и)(?![А-Яа-яЁё])
    instead: пишем «по закону», «срок ответа», «следующий шаг»
  - pattern: (?<![А-Яа-яЁё])систем[аеыу](?![А-Яа-яЁё])
    except: (?<![А-Яа-яЁё])(нервн|дыхательн|сердечно-сосудист|сосудист|кровеносн|пищеварительн|мочевыделительн|мочеполов|иммунн|эндокринн|костно-мышечн|опорно-двигательн|лимфатическ|кроветворн)\w* систем[аеыу]
    instead: пишем «по закону», «срок ответа», «следующий шаг»
  - pattern: (?<![А-Яа-яЁё])покров|(?<![А-Яа-яЁё])ангел|(?<![А-Яа-яЁё])переход в мир
    instead: не используем
