  verified_at: "2026-10-11"
  lint_allow: []
- id: 398n-p2
  text_verbatim: "2. Признать утратившими силу: приказ Министерства здравоохранения Российской Федерации от 31 мая 2019 г. № 348н «Об утверждении перечня медицинских изделий, предназначенных для поддержания функций органов и систем организма человека, предоставляемых для использования на дому» (зарегистрирован Министерством юстиции Российской Федерации 28 июня 2019 г., регистрационный № 55087); приказ Министерства здравоохранения Российской Федерации от 2 ноября 2020 г. № 1195н «О внесении изменений в перечень медицинских изделий, предназначенных для поддержания функций органов и систем организма человека, предоставляемых для использования на дому, утвержденный приказом Министерства здравоохранения Российской Федерации от 31 мая 2019 г. № 348н» (зарегистрирован Министерством юстиции Российской Федерации 4 декабря 2020 г., регистрационный № 61260)."
  source_ref: pravo-398n
  eoNumber: "0001202508130021"
  url: "http://publication.pravo.gov.ru/document/0001202508130021"
  point: "пункт 2"
  scan_page: "1"
