name: sync-data
on:
  schedule: [{ cron: "43 5 * * 2" }]
  workflow_dispatch:
permissions: {}
concurrency: { group: sync-data, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: { contents: write, pull-requests: write, issues: write, actions: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.11.7", enable-cache: false }
      - run: uv sync --frozen
      - run: uv run python -m opsite sync-data --from pages
      - run: uv run python -m opsite build
      - run: uv run python -m opsite check --ci
      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sync/data
          title: "data: снимки соседей"
          commit-message: "data: снимки соседей"
          body: "Новые снимки норм и сроков из pal-norms. Проверьте, что карточки не закрыли канал выдачи без причины"
          labels: review:data
          add-paths: |
            vendor/**
            deps.yaml
      - name: checks on PR
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.pull-request-branch }}
        run: gh workflow run checks.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
      - name: stale
        if: ${{ !cancelled() }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          uv run python -m pipeline.watch --stale-check 21
          test ! -f _reports/watch-stale.json || uv run python -m pipeline.watch --open-issues _reports/watch-stale.json
      - name: keepalive
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for f in watch.yml pages.yml sync-data.yml; do
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${f}/enable"
          done
