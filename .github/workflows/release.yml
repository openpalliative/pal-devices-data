name: release
on:
  push: { tags: ["v*"] }
permissions: {}
concurrency: { group: release, cancel-in-progress: false }
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.11.7", enable-cache: false }
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python -m pipeline.watch --fixtures
      - run: uv run python -m opsite build
      - run: uv run python -m opsite check --ci
      - name: zip
        env:
          REPO: ${{ github.event.repository.name }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "тег должен быть вида v1.2.3"; exit 1 ;; esac
          zip -qr "./${REPO}-${TAG}-site.zip" _site
          (cd _site && zip -qr "../${REPO}-${TAG}-data.zip" data/v1)
          zip -qj "./${REPO}-${TAG}-data.zip" LICENSE-DATA
          sha256sum ./*.zip > SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" ./*.zip SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
